<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پژو پارس ۳بعدی HD - سلطان جاده</title>
    <meta name="description" content="بازی رانندگی سه‌بعدی HD پژو پارس ELX شوتی در آزادراه.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00f0ff">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=45.0.0">
    <!-- Local & CDN Three.js and PeerJS -->
    <script src="three.min.js"></script>
    <script>if (typeof THREE === 'undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
    <script src="peer.min.js"></script>
    <script>if (typeof Peer === 'undefined') document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=45.0.0', { updateViaCache: 'none' }).catch(() => {});
            });
        }
    </script>
</head>
<body>
    <div id="game-container">
        <!-- 3D Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Top Controls Bar -->
        <div id="top-controls-bar">
            <button id="pause-btn" title="توقف بازی">⏸️</button>
            <button id="camera-btn" title="تغییر نمای دوربین">🎥 دوربین</button>
            <button id="screenshot-btn" title="ثبت اسکرین‌شات از بازی">📸 اسکرین‌شات</button>
            <button id="radio-btn" title="تغییر رادیو">📻 رادیو شوتی ⚡</button>
        </div>

        <!-- HUD Header -->
        <div id="hud">
            <div class="hud-group">
                <div class="hud-card">
                    <span class="hud-title">امتیاز:</span>
                    <span id="hud-score" class="hud-value score-value">۰</span>
                </div>
                <div class="hud-card">
                    <span class="hud-title">سکه‌ها:</span>
                    <span id="hud-coins" class="hud-value" style="color:#ffea00;">🪙 ۰</span>
                </div>
            </div>

            <div class="hud-group">
                <div class="hud-card">
                    <span class="hud-title">سرعت:</span>
                    <span id="hud-speed" class="hud-value">۰ km/h</span>
                </div>
                <div class="hud-card">
                    <span class="hud-title">مسافت:</span>
                    <span id="hud-distance" class="hud-value">۰ m</span>
                </div>
            </div>
        </div>

        <!-- Active Powerup Badges -->
        <div id="powerup-bar"></div>

        <!-- Touch Controls for Mobile -->
        <div id="touch-controls">
            <div class="lane-btns">
                <button id="btn-left" class="control-btn">◀</button>
                <button id="btn-right" class="control-btn">▶</button>
            </div>
            <div class="pedal-btns">
                <button id="btn-brake" class="control-btn brake-btn">
                    <span>🛑</span>
                    <span>ترمز</span>
                </button>
                <button id="btn-gas" class="control-btn gas-btn">
                    <span>🟢</span>
                    <span>گاز</span>
                </button>
                <button id="btn-nitro" class="control-btn nitro-btn">
                    <span>⚡</span>
                    <span>نیترو</span>
                </button>
            </div>
        </div>

        <!-- START MENU SCREEN WITH HD PEUGEOT PARS PREVIEW -->
        <div id="menu-screen" class="overlay-screen garage-menu-overlay">
            <div class="menu-top-bar">
                <div class="menu-brand">
                    <span class="game-logo">🏎️</span>
                    <span class="game-title-text">پژو پارس ۳بعدی HD</span>
                </div>
                <div class="driver-stats-pill">
                    <span id="menu-coins">🪙 ۰</span>
                    <span class="stat-divider">|</span>
                    <span id="menu-highscore">🏆 ۰</span>
                    <span class="stat-divider">|</span>
                    <span class="driver-rank-badge">👑 شوتی‌باز برتر</span>
                </div>
            </div>

            <div class="garage-showcase-card">
                <div class="car-status-header">
                    <span class="car-status-label">🚘 نسخه HD شوتی:</span>
                    <span id="menu-selected-car-name" class="car-status-name">پژو پارس ELX HD (شوتی سلطان)</span>
                </div>

                <!-- HD Peugeot Pars Image Preview Banner -->
                <div style="margin: 12px 0; border-radius: 12px; overflow: hidden; border: 2px solid rgba(0, 240, 255, 0.4); box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);">
                    <img src="images/peugeot_pars_hd.png" alt="پژو پارس ELX HD" style="width: 100%; height: 160px; object-fit: cover; display: block;">
                </div>

                <div class="menu-action-stack" style="margin-top:15px;">
                    <button id="btn-start" class="btn-primary btn-garage-start">🚀 شروع رانندگی با پارس HD</button>
                    <div class="menu-btn-row" style="display:flex; gap:10px; margin-top:10px;">
                        <button id="btn-menu-screenshot" class="btn-secondary" style="flex:1;" title="ثبت اسکرین‌شات">📸 اسکرین‌شات HD</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAUSE SCREEN MODAL -->
        <div id="pause-screen" class="overlay-screen hidden">
            <div class="modal-card">
                <h2>⏸️ توقف مسابقه</h2>
                <p class="subtitle">بازی متوقف شده است.</p>
                <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
                    <button id="btn-resume" class="btn-primary">▶ ادامه رانندگی</button>
                    <button id="btn-pause-menu" class="btn-secondary">🏠 منوی اصلی</button>
                </div>
            </div>
        </div>

        <!-- GAME OVER SCREEN MODAL -->
        <div id="gameover-screen" class="overlay-screen hidden">
            <div class="modal-card">
                <h2 style="color:#ff0055;">💥 تصادف شدید!</h2>
                <p id="gameover-reason" class="subtitle">تصادف با خودرو در آزادراه</p>

                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">امتیاز نهایی</span>
                        <span id="final-score" class="stat-val" style="color:var(--accent);">۰</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">سکه‌ها</span>
                        <span id="final-coins" class="stat-val" style="color:#ffea00;">۰</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">مسافت</span>
                        <span id="final-dist" class="stat-val">۰ m</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">رکورد کل</span>
                        <span id="final-highscore" class="stat-val">۰</span>
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button id="btn-restart" class="btn-primary" style="flex:1;">🔄 شروع مجدد</button>
                    <button id="btn-gameover-screenshot" class="btn-secondary" style="width:54px; padding:0; font-size:1.3rem;" title="اسکرین‌شات">📸</button>
                </div>
            </div>
        </div>
    </div>

    <script src="audio.js?v=45.0.0"></script>
    <script src="game.js?v=45.0.0"></script>
</body>
</html>
